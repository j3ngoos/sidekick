# SK-46 (аудит №2 22.10, проблема 5): sidekick-bridge дважды убивали SIGKILL
# (02:03:57 и 11:22:29 — харнесс-зачистки процессов по широкому паттерну, см.
# отчёт SK-46). Ядро-OOM и systemd-oomd за замеры исключены (journal -k чист,
# oomd без записей), но канал обязан переживать любой SIGKILL молча:
#   * OOMPolicy=continue — OOM-убийство процесса не рвёт юнит-машину;
#   * Restart=on-failure + экспоненциальный backoff 5s..30s — поднимает и после
#     сигнала, и после краха, не сжигая start-limit частыми рестартами;
#   * OOMScoreAdjust=-250 — юнит-наследие user-срезов даёт мосту +200 (его
#     первым и вырежут при реальном OOM); канал Hermes тянем к ядру ближе.
# Чистый выход (SIGTERM/SIGINT) мост помечает сам; нечистый — событие
# bridge_unclean_exit в events.jsonl + алерт агентда в чат (SK-46 п.3).
[Unit]
StartLimitIntervalSec=0

[Service]
OOMPolicy=continue
Restart=on-failure
RestartSec=5
RestartMaxDelaySec=30
OOMScoreAdjust=-250
