<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Вход — Тест-банк</title><style>
body{font:14px system-ui;max-width:520px;margin:30px auto;padding:0 12px}
label{display:block;margin:10px 0 3px}
input{padding:6px 8px;width:100%;box-sizing:border-box}
button{margin-top:14px;padding:8px 16px}
#out{margin-top:16px;font-weight:600;color:#059669;min-height:20px}
</style></head><body>
<h2>Тестовая страница SK-04: форма логина</h2>
<form id="login-form" autocomplete="off">
  <label for="login-email">Эл. почта</label>
  <input id="login-email" name="email" type="email">
  <label for="login-pass">Пароль</label>
  <input id="login-pass" name="password" type="password" autocomplete="current-password">
  <label for="login-otp">Одноразовый код</label>
  <input id="login-otp" name="otp" inputmode="numeric" autocomplete="one-time-code">
  <button id="login-btn" type="submit">Войти</button>
</form>
<h3>Карта (эвристики card/autocomplete)</h3>
<form id="card-form" autocomplete="off">
  <label for="cc-num">Номер карты</label>
  <input id="cc-num" name="cc-number" autocomplete="cc-number" inputmode="numeric">
  <label for="cc-cvc">CVC</label>
  <input id="cc-cvc" name="cc-csc" autocomplete="cc-csc" inputmode="numeric">
</form>
<p><a id="oauth-link" href="/login/oauth2/code/google">Войти через Google (OAuth-редирект)</a></p>
<div id="out"></div>
<script>
document.getElementById("login-form").addEventListener("submit", (e) => {
  e.preventDefault();
  document.getElementById("out").textContent = "SUBMITTED";
});
</script>
</body></html>
