<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Тест-форма</title></head>
<body>
<h1>Тест-форма</h1>
<form id="login-form">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" placeholder="you@example.org">
  <label for="pass">Пароль</label>
  <input id="pass" name="password" type="password">
  <button type="submit" id="login-btn">Войти</button>
</form>
<script>
document.getElementById("login-form").addEventListener("submit", (e) => {
  e.preventDefault();
  document.body.innerHTML = '<h1 id="done">SUBMITTED</h1>';
});
</script>
</body>
</html>
