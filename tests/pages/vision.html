<!doctype html>
<html><head><meta charset="utf-8">
<title>sk47:pending</title>
<style>
html,body{margin:0;background:#e8112d;font-family:monospace;color:#fff}
#marker{position:fixed;left:0;top:0;width:8px;height:8px;background:#ff00ff;z-index:9}
#outside-text{position:fixed;left:20px;top:20px;font-size:20px}
#dlg{position:fixed;left:40px;top:300px;width:420px;height:260px;background:#00aa44;
     color:#fff;padding:10px;box-sizing:border-box;border:3px solid #004d1f;font-size:18px}
#grid{position:relative;height:1100px;margin-top:40px}
#grid button{position:absolute;width:120px;height:34px}
#tall{height:3000px}
</style></head>
<body>
<div id="marker"></div>
<div id="outside-text">OUTSIDE-DIALOG-7B21</div>
<div id="dlg">DIALOG-ONLY-TEXT-9F3C
  <button id="d1" style="position:absolute;left:20px;top:190px">Dialog one</button>
  <button id="d2" style="position:absolute;left:160px;top:190px">Dialog two</button>
</div>
<div id="grid">
  <button id="b1" style="left:40px;top:80px">Alpha</button>
  <button id="b2" style="left:200px;top:80px">Bravo</button>
  <button id="b3" style="left:360px;top:80px">Charlie</button>
  <button id="b4" style="left:40px;top:140px">Delta</button>
  <button id="b5" style="left:200px;top:140px">Echo</button>
  <button id="b6" style="left:360px;top:140px">Foxtrot</button>
  <button id="b7" style="left:40px;top:200px">Golf</button>
  <button id="b8" style="left:200px;top:200px">Hotel</button>
  <button id="b9" style="left:360px;top:200px">India</button>
  <button id="b10" style="left:520px;top:140px">Juliett</button>
  <button id="b11" style="left:520px;top:200px">Kilo</button>
  <button id="b12" style="left:200px;top:260px">Lima</button>
</div>
<div id="tall"></div>
<script>
// state-канал харнесса (прецедент sk44): title = sk47:{json}
// dlgRect — геометрия #dlg (fixed → стабильна при скролле): обычный div не попадает
// в page.dom (не интерактивен), а V3-приёмке нужен точный rect для clip.
const clicks = [];
function st(){ const b = document.getElementById("dlg").getBoundingClientRect();
  return {clicks, n: clicks.length, dlgRect: [b.x, b.y, b.width, b.height]}; }
function note(id){ clicks.push(id);
  document.title = "sk47:" + JSON.stringify(st()); }
document.querySelectorAll("button").forEach(b =>
  b.addEventListener("click", () => note(b.id)));
document.title = "sk47:" + JSON.stringify({...st(), ready: 1});
</script>
</body></html>
