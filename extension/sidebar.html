<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="sidebar.css">
</head><body>
<!-- SK-30: inline SVG sprite — единственная иконочная библиотека сайдбара.
     16px, stroke 2, currentColor (красится классом .icn в sidebar.css), без
     файлов-картинок и без npm. Символы только геометрические: эмодзи в chrome
     UI запрещены контрактом SK-30 п.2; статус-глифы мигрировали сюда же
     (GLYPH_ICON в модулях сайдбара и фидa подменяют текстовую метку иконкой). -->
<svg id="spr" aria-hidden="true"><defs>
<symbol id="ic-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
<symbol id="ic-history" viewBox="0 0 24 24"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></symbol>
<symbol id="ic-audit" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="ic-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
<symbol id="ic-skills" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
<symbol id="ic-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
<symbol id="ic-send" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></symbol>
<symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="ic-menu" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>
<!-- SK-35: колокольчик журнала «позови человека» и стрелка «свернуть панель» -->
<symbol id="ic-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
<symbol id="ic-collapse" viewBox="0 0 24 24"><path d="M11 17l-5-5 5-5"/><path d="M18 17l-5-5 5-5"/></symbol>
<symbol id="ic-theme" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
<symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></symbol>
<symbol id="ic-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="ic-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></symbol>
<symbol id="ic-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></symbol>
<symbol id="ic-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></symbol>
<symbol id="ic-transfer" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
<symbol id="ic-hand" viewBox="0 0 24 24"><path d="M6 11V7.5a1.5 1.5 0 0 1 3 0V11"/><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M12 11V6a1.5 1.5 0 0 1 3 0v5"/><path d="M15 11.5V9a1.5 1.5 0 0 1 3 0v5a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.1-2.2l-3-3.4a1.6 1.6 0 0 1 2.4-2.1L6 15"/></symbol>
<symbol id="ic-think" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2h6c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></symbol>
<symbol id="ic-memory" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></symbol>
<symbol id="ic-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></symbol>
<symbol id="ic-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
<symbol id="ic-chevron" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
<symbol id="ic-chevdown" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="ic-ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
<symbol id="ic-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
<symbol id="ic-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="ic-cross" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="ic-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
<symbol id="ic-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/></symbol>
<symbol id="ic-dotsoft" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/></symbol>
<symbol id="ic-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
<symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="ic-replace" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></symbol>
<symbol id="ic-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
<symbol id="ic-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="ic-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M17 6l3 3"/></symbol>
<symbol id="ic-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></symbol>
<symbol id="ic-state" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></symbol>
<!-- SK-38 п.1/2: галстук-логотип — силуэт молнии из иконки расширения (PNG-комплект
     scripts/gen-icons.py рисуется той же геометрией), опознаёт аддон и в шапке, и в тулбаре. -->
<symbol id="ic-bolt" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
<!-- SK-40: аватар-глиф человека (пузырь пользователя) и градиент логотипа —
     стопы красятся токенами тем (--bolt-a/b), поэтому url(#g-bolt) адаптивен. -->
<symbol id="ic-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
<linearGradient id="g-bolt" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
<stop offset="0" style="stop-color:var(--bolt-a)"/><stop offset="1" style="stop-color:var(--bolt-b)"/>
</linearGradient>
</defs></svg>
<!-- SK-38 (шапка): «Hermes»-подпись и статусные чипы («думает»/«выполняет») из
     шапки убраны — статус и так живёт внизу, в карточке задачи и think-блоке, а
     агентский бейдж несёт иконка тулбара (background badge). В шапке: логотип-молния
     (inline-SVG, красится --accent), заголовок чата (первый запрос с truncation, либо
     «Новый чат»), точка моста (SK-13, тултип — честный статус) и «⋯» (переехала из
     нижнего бара, SK-38 п.3). Высота шапки постоянная (--hd-h) — от неё позиционируется
     меню-портал. -->
<div id="hd">
  <div id="hdrow">
    <svg id="hdic" class="icn" aria-hidden="true"><use href="#ic-bolt"/></svg>
    <h1 id="ttl">Новый чат</h1>
    <span id="st" data-s="idle" title="bridge: …"></span>
    <!-- SK-35: колокольчик (непрочитанный журнал «позови человека») и ручное
         сворачивание панели. window.close() из этого документа закрывает сайдбар
         без жеста (пробда firefox-158) — sidebarAction.close() без жеста схема
         Firefox отклоняет, поэтому панель закрывает себя сама. -->
    <button id="bellBtn" title="Журнал: позвать человека" aria-label="Журнал уведомлений" aria-haspopup="true" aria-expanded="false"><svg class="icn" aria-hidden="true"><use href="#ic-bell"/></svg><span id="belln" hidden>0</span></button>
    <button id="collapseBtn" title="Свернуть панель" aria-label="Свернуть панель"><svg class="icn" aria-hidden="true"><use href="#ic-collapse"/></svg></button>
    <button id="menuBtn" title="Меню" aria-label="Меню" aria-haspopup="menu" aria-expanded="false"><svg class="icn" aria-hidden="true"><use href="#ic-menu"/></svg></button>
  </div>
</div>
<!-- SK-22: the SK-06 permanent step band is gone — steps live inside the task card
     in the chat feed (модуль feed), so the feed no longer spams «click, click, click». -->
<div id="log"></div>
<!-- SK-40: пустое состояние ленты — крупный глиф-молния + приглашение. Синхронизирует
     видимость модуль сайдбара (syncEmpty): пусто и нет второго вида → показываем. -->
<div id="empty" hidden>
  <svg id="embolt" class="icn" aria-hidden="true"><use href="#ic-bolt"/></svg>
  <div id="empttl">Новый чат</div>
  <div id="emsub">Напиши, что сделать — Hermes выполнит в браузере и покажет шаги</div>
</div>
<!-- SK-11: audit feed (second view — the chat log hides while it is open). Rows are
     rendered from the bridge's audit.jsonl via WS audit_get; «сырой файл» shows the
     same lines monospace (masked on the bridge AND re-masked here, defensively).
     SK-30: панель — второй «стеклянный» слой, кнопки бара — SVG. -->
<div id="aud" hidden>
  <div id="audbar">
    <input id="audf" placeholder="фильтр: домен / метод…" autocomplete="off">
    <button id="audref" class="iconbtn" title="Обновить ленту"><svg class="icn" aria-hidden="true"><use href="#ic-refresh"/></svg></button>
    <button id="audrawBtn" title="Показать сырые строки audit.jsonl">сырой файл</button>
    <button id="audclose" class="iconbtn" title="Закрыть журнал"><svg class="icn" aria-hidden="true"><use href="#ic-close"/></svg></button>
  </div>
  <div id="audlist"></div>
  <pre id="audraw" hidden></pre>
  <div id="audn"></div>
</div>
<!-- SK-23: chat history (second view — like the audit, the chat feed steps aside).
     Rows come from the bridge's chats.jsonl via WS chats_get; a click loads that
     chat's feed and switches the active chat_id (persisted in storage.local). -->
<div id="hist" hidden>
  <div id="histbar">
    <span id="histttl"><svg class="icn" aria-hidden="true"><use href="#ic-history"/></svg>История чатов</span>
    <button id="histref" class="iconbtn" title="Обновить список"><svg class="icn" aria-hidden="true"><use href="#ic-refresh"/></svg></button>
    <button id="histclose" class="iconbtn" title="Закрыть"><svg class="icn" aria-hidden="true"><use href="#ic-close"/></svg></button>
  </div>
  <div id="histlist"></div>
  <div id="histn"></div>
</div>
<!-- SK-10: «/»-menu (keyboard: ↑↓/Enter/Esc, mouse: mousedown on a row), the save-as-skill
     row, and the export/import panel. All state lives in storage.local — sk10Skills. -->
<div id="skmenu" hidden><div id="sklist"></div><div id="skhint"></div></div>
<div id="skname" hidden>
  <input id="sknamein" placeholder="имя навыка (пусто = первые 40 символов)" autocomplete="off">
  <button id="sknameok">Сохранить</button><button id="sknamecancel">Отмена</button>
</div>
<div id="skio" hidden>
  <div class="row"><button id="skexp"><svg class="icn" aria-hidden="true"><use href="#ic-download"/></svg>экспорт .json</button><button id="skimpr"><svg class="icn" aria-hidden="true"><use href="#ic-upload"/></svg>импорт из файла…</button></div>
  <textarea id="skpaste" rows="3" placeholder="…или вставь JSON сюда и нажми «загрузить»"></textarea>
  <div class="row"><button id="skpasteok">загрузить из вставки</button><span id="skioMsg"></span></div>
</div>
<input type="file" id="skfile" hidden accept=".json,application/json">
<!-- SK-38 п.3/4/5: нижняя панель = композер + ОДНА кнопка. «⋯» уехала в шапку,
     кнопка морфится: покой = «отправить» (самолётик), задача идёт = «стоп»
     (квадрат, красный акцент) — 150 мс; Esc в документе = тот же стоп.
     Живой плейсхолдер — оверлей #phin над пустым полем (нативный placeholder —
     статичный запас для prefers-reduced-motion и до старта JS). -->
<div id="bar"><div id="inwrap"><input id="in" placeholder="спроси что угодно" autocomplete="off"><span id="phin" class="ph" aria-hidden="true"></span></div>
<button id="go" title="Отправить" aria-label="Отправить"><svg class="icn ic-send" aria-hidden="true"><use href="#ic-send"/></svg><svg class="icn ic-stop" aria-hidden="true"><use href="#ic-stop"/></svg></button></div>
<div id="menu" hidden role="menu" aria-label="Меню Hermes">
  <button class="mi" id="newBtn" role="menuitem" title="Новый чат (чистая лента, новая сессия Hermes)"><svg class="icn" aria-hidden="true"><use href="#ic-plus"/></svg><span>Новый чат</span></button>
  <button class="mi" id="histBtn" role="menuitem" title="История чатов"><svg class="icn" aria-hidden="true"><use href="#ic-history"/></svg><span>История чатов</span></button>
  <button class="mi" id="audBtn" role="menuitem" title="Журнал действий агента (аудит)"><svg class="icn" aria-hidden="true"><use href="#ic-audit"/></svg><span>Журнал агента</span></button>
  <div class="msep" role="separator"></div>
  <button class="mi" id="sksave" role="menuitem" title="Сохранить текущий промпт как навык"><svg class="icn" aria-hidden="true"><use href="#ic-save"/></svg><span>Сохранить промпт</span></button>
  <button class="mi" id="skioBtn" role="menuitem" title="Экспорт/импорт сохранённых навыков (json)"><svg class="icn" aria-hidden="true"><use href="#ic-transfer"/></svg><span>Навыки: экспорт/импорт</span></button>
  <div class="msep" role="separator"></div>
  <button class="mi" id="themeBtn" role="menuitem" title="Тема: системная → светлая → тёмная"><svg class="icn" aria-hidden="true"><use href="#ic-theme"/></svg><span id="themeLbl">Тема: как в системе</span></button>
  <button class="mi" id="optBtn" role="menuitem" title="Настройки расширения"><svg class="icn" aria-hidden="true"><use href="#ic-settings"/></svg><span>Настройки</span></button>
  <button class="mi danger" id="stopTask" role="menuitem" disabled title="Остановить текущую задачу агента"><svg class="icn" aria-hidden="true"><use href="#ic-stop"/></svg><span>Стоп задача</span></button>
</div>
<!-- SK-35: выпадающий журнал «позови человека» (второй стеклянный портал, тот же
     паттерн, что #menu): события task_done / task_failed / perm. Клик по событию —
     перейти к карточке (чат задачи/пермис-карточка) и снять прочитанное. -->
<div id="bellpanel" hidden role="dialog" aria-label="Журнал уведомлений">
  <div id="bellhead"><span>Журнал</span><button id="bellClose" title="Закрыть" aria-label="Закрыть журнал"><svg class="icn" aria-hidden="true"><use href="#ic-close"/></svg></button></div>
  <div id="bellrows"></div>
  <div id="bellfoot"><button id="bellReadAll" type="button">Прочитать всё</button></div>
</div>
<script src="skills.js"></script><script src="audit.js"></script><script src="feed.js"></script><script src="sidebar.js"></script></body></html>
